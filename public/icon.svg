<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#walletGrad)" stroke-width="6" opacity="0.12"/>

  <!-- Wallet body -->
  <g transform="translate(256 256)">
    <rect x="-130" y="-90" width="260" height="180" rx="28" fill="url(#walletGrad)" opacity="0.18"/>
    <rect x="-130" y="-90" width="260" height="180" rx="28" fill="none" stroke="url(#walletGrad)" stroke-width="10"/>

    <!-- Wallet flap (rounded rectangle pocket) -->
    <rect x="-90" y="-60" width="200" height="130" rx="20" fill="none" stroke="url(#walletGrad)" stroke-width="10"/>

    <!-- Card slot -->
    <rect x="40" y="-40" width="70" height="46" rx="10" fill="url(#flapGrad)"/>

    <!-- Chip dots -->
    <circle cx="58" cy="-17" r="4" fill="#0a0e1a"/>
    <circle cx="76" cy="-17" r="4" fill="#0a0e1a"/>
    <circle cx="94" cy="-17" r="4" fill="#0a0e1a"/>

    <!-- Strap line on the left edge of flap -->
    <line x1="-90" y1="-5" x2="-90" y2="40" stroke="url(#walletGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Big X logo hint inside flap -->
    <text x="-10" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="80" font-weight="800" text-anchor="middle" fill="url(#walletGrad)" opacity="0.9">X</text>
  </g>
</svg>
